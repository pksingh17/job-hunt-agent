<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D3557"/>
      <stop offset="1" stop-color="#0B1626"/>
    </linearGradient>
    <linearGradient id="north" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC27A"/>
      <stop offset="1" stop-color="#F08A3C"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#2A4A73"/>
      <stop offset="1" stop-color="#132438"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>

  <!-- handle -->
  <line x1="318" y1="318" x2="404" y2="404" stroke="#F5EBDD" stroke-width="50" stroke-linecap="round"/>

  <!-- lens -->
  <circle cx="226" cy="226" r="122" fill="url(#lens)"/>
  <circle cx="226" cy="226" r="122" fill="none" stroke="#F5EBDD" stroke-width="30"/>

  <!-- compass ticks -->
  <g stroke="#5D7A9E" stroke-width="7" stroke-linecap="round">
    <line x1="226" y1="128" x2="226" y2="144"/>
    <line x1="226" y1="308" x2="226" y2="324"/>
    <line x1="128" y1="226" x2="144" y2="226"/>
    <line x1="308" y1="226" x2="324" y2="226"/>
  </g>

  <!-- needle, pointing up and forward -->
  <g transform="rotate(38 226 226)">
    <polygon points="226,132 252,226 200,226" fill="url(#north)"/>
    <polygon points="226,320 252,226 200,226" fill="#7F95B3"/>
    <circle cx="226" cy="226" r="11" fill="#F5EBDD"/>
  </g>

  <!-- spark: the match -->
  <path d="M402 84 L412 116 L444 126 L412 136 L402 168 L392 136 L360 126 L392 116 Z" fill="#FFC27A"/>
</svg>
